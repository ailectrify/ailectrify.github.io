# Deploy der statischen Website + PHP-API per SSH/rsync nach Checkdomain.
# Secrets: siehe docs/deploy-checkdomain.md
name: Deploy Checkdomain

on:
  workflow_dispatch:
    inputs:
      delete_extraneous:
        description: "rsync --delete (entfernt Dateien auf dem Server, die nicht im Repo sind)"
        type: boolean
        default: false
  # Nach erfolgreichem Secret-Setup optional aktivieren:
  # push:
  #   branches: [main]

concurrency:
  group: deploy-checkdomain
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          CHECKDOMAIN_SSH_KEY: ${{ secrets.CHECKDOMAIN_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$CHECKDOMAIN_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add host to known_hosts
        env:
          SSH_HOST: ${{ secrets.CHECKDOMAIN_HOST }}
          SSH_PORT: ${{ secrets.CHECKDOMAIN_PORT }}
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          ssh-keyscan -p "$port" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync to Checkdomain
        env:
          SSH_HOST: ${{ secrets.CHECKDOMAIN_HOST }}
          SSH_USER: ${{ secrets.CHECKDOMAIN_USER }}
          SSH_PORT: ${{ secrets.CHECKDOMAIN_PORT }}
          DEST: ${{ secrets.CHECKDOMAIN_PATH }}
          DELETE: ${{ inputs.delete_extraneous }}
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ] || [ -z "${DEST:-}" ]; then
            echo "Missing secrets: CHECKDOMAIN_HOST, CHECKDOMAIN_USER, CHECKDOMAIN_PATH (and CHECKDOMAIN_SSH_KEY)."
            exit 1
          fi

          # Kurztest der SSH-Anmeldung (ein Key, IdentitiesOnly)
          ssh -i ~/.ssh/deploy_key -p "$port" \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" 'echo ssh-ok'

          rsync_opts=(-avz --human-readable)
          if [ "${DELETE:-false}" = "true" ]; then
            rsync_opts+=(--delete)
          fi

          rsync_opts+=(
            --exclude '.git/'
            --exclude '.github/'
            --exclude '.gitignore'
            --exclude 'README.md'
            --exclude 'docs/'
            --exclude '.DS_Store'
          )

          rsync "${rsync_opts[@]}" \
            -e "ssh -i ~/.ssh/deploy_key -p ${port} -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o PasswordAuthentication=no -o BatchMode=yes" \
            ./ "${SSH_USER}@${SSH_HOST}:${DEST}/"
