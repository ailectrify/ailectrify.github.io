<svg class="diagramm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" role="img" aria-label="Eine Prozesslinie mit zwei Schritten A und B, die zusammen etwa 6,5 Stunden pro Woche kosten (Schätzung). Am Ende steht die offene Frage, ob KI hier hilft." font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11">
<path d="M14 70 H300" fill="none" stroke="var(--tinte-2,#4C5D6C)" stroke-width="1.5"/>
<circle cx="90" cy="70" r="4.5" fill="var(--marke,#0077B7)"/>
<path d="M90 78 V106" fill="none" stroke="var(--linie,#D5DDE4)" stroke-width="1" stroke-dasharray="2 4"/>
<text x="90" y="122" fill="var(--marke,#0077B7)" font-size="12" text-anchor="middle">A</text>
<text x="90" y="136" fill="var(--tinte-2,#4C5D6C)" font-size="10" text-anchor="middle">Schritt</text>
<circle cx="200" cy="70" r="4.5" fill="var(--marke,#0077B7)"/>
<path d="M200 78 V106" fill="none" stroke="var(--linie,#D5DDE4)" stroke-width="1" stroke-dasharray="2 4"/>
<text x="200" y="122" fill="var(--marke,#0077B7)" font-size="12" text-anchor="middle">B</text>
<text x="200" y="136" fill="var(--tinte-2,#4C5D6C)" font-size="10" text-anchor="middle">Schritt</text>
<rect x="320" y="54" width="86" height="32" rx="4" fill="var(--flaeche-3,#E6ECF1)" stroke="var(--marke,#0077B7)" stroke-width="1.5"/><text x="330" y="74.0" fill="var(--marke,#0077B7)" font-size="12">KI?</text>
<text x="14" y="152" fill="var(--tinte,#16232F)" font-size="12">6,5 h/Woche</text>
<rect x="104" y="140" width="71" height="16" rx="4" fill="none" stroke="var(--tinte,#16232F)" stroke-width="1"/><text x="110" y="151.5" fill="var(--tinte,#16232F)" font-size="10" letter-spacing="0.5">SCHÄTZUNG</text>
</svg>
